apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: myflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  run-github-actions:
    steps:
      - name: Run test-and-build-image2
        id: gha-run
        uses: cloudbees-io/ghactions-run-workflow@v2
        with:
          token: ${{ secrets.WES_GH_TOKEN }}
          org-name: cloudbees-days
          repo-name: hackers-prusg
          branch-name: main
          workflow-name: test-and-build-image2
          test-type: JUnit
          test-result-location: junit.xml
      - name: Publish run result
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## myflow — GitHub Actions Run Result

            | Field | Value |
            |-------|-------|
            | Workflow | test-and-build-image2 |
            | Repository | cloudbees-days/hackers-prusg |
            | Branch | main |
            | Status | Completed successfully |
          format: MARKDOWN
