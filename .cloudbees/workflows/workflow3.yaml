apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: workflow3
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  run-test-and-build-image2:
    steps:
      - name: Run test-and-build-image2
        uses: cloudbees-io/ghactions-run-workflow@v2
        with:
          token: ${{ secrets.WES_GH_TOKEN }}
          org-name: cloudbees-days
          repo-name: hackers-prusg
          branch-name: main
          workflow-name: test-and-build-image2
          test-type: JUnit
          test-result-location: junit.xml

  run-test-and-build-image:
    steps:
      - name: Run test-and-build-image
        uses: cloudbees-io/ghactions-run-workflow@v2
        with:
          token: ${{ secrets.WES_GH_TOKEN }}
          org-name: cloudbees-days
          repo-name: hackers-prusg
          branch-name: main
          workflow-name: test-and-build-image
          test-type: JUnit
          test-result-location: junit.xml

  capture-results:
    needs:
      - run-test-and-build-image2
      - run-test-and-build-image
    steps:
      - name: Publish combined run results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## workflow3 — Parallel GitHub Actions Run Results

            Both `test-and-build-image2` and `test-and-build-image` GitHub Actions workflows were triggered in parallel and have completed. See each job's status above for its individual pass/fail result.
          format: MARKDOWN
