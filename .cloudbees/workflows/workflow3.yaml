apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: workflow3
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  run-test-and-build-image2:
    outputs:
      RESULT: ${{ steps.gha-run.outcome }}
    steps:
      - name: Run test-and-build-image2
        id: gha-run
        uses: cloudbees-io/ghactions-run-workflow@v2
        with:
          token: ${{ secrets.WES_GH_TOKEN }}
          org-name: cloudbees-days
          repo-name: hackers-prusg
          branch-name: main
          workflow-name: test-and-build-image2
          test-type: JUnit
          test-result-location: junit.xml

  run-test-and-build-image:
    outputs:
      RESULT: ${{ steps.gha-run.outcome }}
    steps:
      - name: Run test-and-build-image
        id: gha-run
        uses: cloudbees-io/ghactions-run-workflow@v2
        with:
          token: ${{ secrets.WES_GH_TOKEN }}
          org-name: cloudbees-days
          repo-name: hackers-prusg
          branch-name: main
          workflow-name: test-and-build-image
          test-type: JUnit
          test-result-location: junit.xml

  capture-results:
    needs:
      - run-test-and-build-image2
      - run-test-and-build-image
    steps:
      - name: Publish combined run results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## workflow3 — Parallel GitHub Actions Run Results

            | Workflow | Result |
            |----------|--------|
            | test-and-build-image2 | ${{ needs.run-test-and-build-image2.outputs.RESULT }} |
            | test-and-build-image | ${{ needs.run-test-and-build-image.outputs.RESULT }} |
          format: MARKDOWN
